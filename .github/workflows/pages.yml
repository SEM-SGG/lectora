# GitHub Pages von Hand auf eine bestehende Version setzen (Zurückrollen): Actions → pages → Run workflow → Tag (z. B. v2.0.0).
# Nimmt Lectora.html aus dem Release dieses Tags (Prüfsumme aus SHA256SUMS.txt desselben Release), version.json vom Tag und die
# Produktdokumentation (docs/lectora-dokumentation.html als dokumentation.html) vom Tag; ältere Tags ohne diese Datei: die von main.
# Ältere Offline-Ausgaben sehen danach diese Version als neuste. Siehe docs/release.md, Abschnitt «Zurückrollen».
name: pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag einer veröffentlichten Version, z. B. v2.0.0'
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pages:
    name: GitHub Pages auf eine bestehende Version
    runs-on: ubuntu-24.04
    # deploy-pages wartet selbst bis zu 10 Minuten auf die Bereitstellung
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Tag prüfen
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # [[ =~ ]] statt grep: grep prüft Zeile für Zeile und liesse eine Eingabe mit Zeilenumbruch durch
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Gib den Tag einer veröffentlichten Version ein, mit «v», zum Beispiel v2.0.0."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag liegt auf main, Release besteht, Datei unverändert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::Der Tag $TAG zeigt auf einen Commit, der nicht auf main liegt. Wähle den Tag einer veröffentlichten Version."; exit 1; }
          mkdir -p dl site
          gh release download "$TAG" --dir dl --pattern Lectora.html --pattern SHA256SUMS.txt
          (cd dl && grep ' Lectora.html$' SHA256SUMS.txt | sha256sum -c -)
          python3 tools/release_check.py "$TAG"
          cp dl/Lectora.html site/index.html
          cp version.json site/version.json
          if [ -f docs/lectora-dokumentation.html ]; then
            cp docs/lectora-dokumentation.html site/dokumentation.html
          else
            echo "::warning::Der Tag $TAG enthält keine Produktdokumentation; GitHub Pages erhält die von main."
            git show origin/main:docs/lectora-dokumentation.html > site/dokumentation.html
          fi
          touch site/.nojekyll
      # Ein Name je Versuch: Bei «Re-run failed jobs» findet deploy-pages sonst auch die Seite des früheren Versuchs
      # und bricht ab («Multiple artifacts named …»), weil es den Namen in allen Versuchen des Laufs sucht
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Warten, bis die Seite in der Liste des Laufs steht
        # deploy-pages sucht das Artefakt in der Liste des Laufs. Unmittelbar nach dem Hochladen fehlt es dort manchmal noch
        # («No artifacts named …», Lauf von 2.0.1). Die Pause macht das seltener, schliesst es aber nicht aus.
        run: sleep 30
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
