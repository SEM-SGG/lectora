# Monatlicher Abgleich der Erlasstabelle (src/erlasse.js) mit Fedlex. Bei Unterschieden: Pull Request mit der übernommenen
# Tabelle und einem Bericht; ohne Unterschiede: nichts. Läuft auch auf Knopfdruck (Actions → erlasse → Run workflow).
# Voraussetzung: «Allow GitHub Actions to create and approve pull requests» (Organisation und Repository, docs/repo-einstellungen.md).
# Der Abgleich bricht ab, wenn Fedlex unplausible Werte liefert (Grenzen in tools/erlasse_abgleich.py); dann entsteht kein Pull Request.
# Hinweis: Ein Pull Request, den der eingebaute Token anlegt, startet die Prüfungen (checks) nicht von selbst. Starte sie im
# Pull Request mit «Close» und «Reopen» oder mit einem leeren Commit auf dem Zweig.
name: erlasse

on:
  schedule:
    - cron: '23 4 3 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: erlasse
  cancel-in-progress: false

jobs:
  abgleich:
    name: Abgleich mit Fedlex
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      ZWEIG: erlasse/abgleich
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Kein Token im Arbeitsverzeichnis: Der Abgleich verarbeitet Daten von Fedlex; geschoben wird nur im letzten Schritt
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Abgleich (übernimmt Änderungen in src/erlasse.js und design/erlasse-quellen.csv)
        id: abgleich
        run: |
          set +e
          python3 tools/erlasse_abgleich.py --write --report bericht.md
          code=$?
          set -e
          if [ "$code" = 2 ]; then echo "Fedlex nicht erreichbar"; exit 1; fi
          if [ "$code" = 4 ]; then echo "::error::Fedlex lieferte unplausible Werte; nichts übernommen (siehe Protokoll)"; exit 1; fi
          if git diff --quiet -- src/erlasse.js design/erlasse-quellen.csv && [ "$code" = 0 ]; then
            echo "geaendert=nein" >> "$GITHUB_OUTPUT"
          else
            echo "geaendert=ja" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests der Tabelle (Regeln R04 und X12, Abgleich)
        if: steps.abgleich.outputs.geaendert == 'ja'
        run: |
          node test/ausbau_test.mjs
          python3 test/erlasse_test.py
      - name: Pull Request anlegen oder aktualisieren
        if: steps.abgleich.outputs.geaendert == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$ZWEIG"
          git add src/erlasse.js design/erlasse-quellen.csv
          if git diff --cached --quiet; then
            echo "Nur Fälle zum Prüfen von Hand, keine Änderung an der Tabelle." >> bericht.md
            git commit --allow-empty -m "Erlasstabelle: Abgleich mit Fedlex ($(date -u +%F)), nur Hinweise"
          else
            git commit -m "Erlasstabelle: Abgleich mit Fedlex ($(date -u +%F))"
          fi
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$ZWEIG"
          offen="$(gh pr list --head "$ZWEIG" --state open --json number --jq '.[0].number')"
          if [ -n "$offen" ]; then
            gh pr edit "$offen" --body-file bericht.md
          else
            basis="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"
            gh pr create --base "$basis" --head "$ZWEIG" --title "Erlasstabelle: Abgleich mit Fedlex" --body-file bericht.md
          fi
