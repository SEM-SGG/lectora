# Veröffentlichung bei einem Versions-Tag vX.Y.Z:
#   1. pruefen: Tag, package.json, version.json und CHANGELOG.md stimmen überein; bauen; alle Tests
#   2. release: GitHub Release mit Lectora.html (fester Name), Lectora-X.Y.Z.html, SHA256SUMS.txt; Text aus CHANGELOG.md
#   3. pages: dieselbe Offline-Ausgabe als index.html und version.json auf GitHub Pages (https://sem-sgg.github.io/lectora/);
#      erst damit sehen die Offline-Ausgaben die neue Version (Versionsabfrage)
# Nur ein Tag auf einem Commit von main wird veröffentlicht. Die Umgebung github-pages muss Tags v* zulassen (docs/repo-einstellungen.md).
# Die Ausgabe ohne Versionsabfrage wird gebaut und getestet, aber nicht veröffentlicht.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pruefen:
    name: Prüfen und bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Der Tag zeigt auf einen Commit von main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Der Tag $GITHUB_REF_NAME zeigt auf einen Commit, der nicht auf main liegt. Veröffentlicht wird nur, was auf main zusammengeführt ist."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Versionen stimmen überein
        run: python3 tools/release_check.py "$GITHUB_REF_NAME" --notes notizen.md
      - name: Systempakete (LibreOffice, poppler-utils, qpdf)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer libreoffice-impress poppler-utils qpdf
      - name: Pakete installieren
        run: |
          npm ci
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Bauen (Stand = Datum des Tags)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          node build.mjs --local
          node build.mjs
          node build.mjs --offline
          node build.mjs --offline --no-update-check
      - name: Alle Tests
        run: python3 test/run.py --ohne-build
      - name: Dateien für die Veröffentlichung
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p veroeffentlichung
          cp "dist-offline/Lectora-$V.html" "veroeffentlichung/Lectora-$V.html"
          cp "dist-offline/Lectora-$V.html" veroeffentlichung/Lectora.html
          cp notizen.md veroeffentlichung/notizen.md
          # Versionsdatei für die Abfrage der Offline-Ausgaben: geht erst mit GitHub Pages online, nach dem Release
          cp version.json veroeffentlichung/version.json
          cd veroeffentlichung && sha256sum "Lectora-$V.html" Lectora.html > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veroeffentlichung
          path: veroeffentlichung/
          retention-days: 30
      - name: Testausgabe sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testausgabe-release
          path: |
            test/out/
            test/shots/
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: pruefen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: veroeffentlichung
          path: veroeffentlichung
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd veroeffentlichung
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Lectora $V" --notes-file notizen.md \
            "Lectora.html" "Lectora-$V.html" "SHA256SUMS.txt"

  pages:
    name: GitHub Pages
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: veroeffentlichung
          path: veroeffentlichung
      - name: Seite zusammenstellen
        run: |
          mkdir -p site
          cp veroeffentlichung/Lectora.html site/index.html
          # Erst jetzt (Tests bestanden, Release angelegt) erfahren die Offline-Ausgaben von der neuen Version
          cp veroeffentlichung/version.json site/version.json
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
